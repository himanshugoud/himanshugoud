name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"   # once a day at 3am UTC
  workflow_dispatch:        # lets you trigger it manually too

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate stats and languages cards
        run: python3 generate_stats_cards.py himanshugoud

      - name: Generate contribution activity chart
        run: python3 generate_activity_graph.py himanshugoud

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: himanshugoud
          outputs: |
            profile/snake.svg
            profile/snake-dark.svg?palette=github-dark

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg profile/activity.svg profile/snake.svg profile/snake-dark.svg
          git commit -m "Update README stat cards" || echo "Nothing to commit"
          git push
